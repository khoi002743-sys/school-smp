<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>School SMP — Leaderboards</title>
  <style>
    :root{color-scheme:dark;--bg:#090d18;--panel:#111827;--line:#253147;--muted:#9aa8bd;--text:#f4f7fb;--accent:#8b5cf6}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17213a 0,var(--bg) 55%);font:15px system-ui,sans-serif;color:var(--text);min-height:100vh}
    header{padding:42px 20px 24px;text-align:center}header .tag{color:#b7a2ff;font-weight:700;letter-spacing:.18em;font-size:12px}h1{font-size:clamp(32px,6vw,54px);margin:10px 0 6px}header p{color:var(--muted);margin:0}
    main{max-width:1000px;margin:auto;padding:10px 18px 60px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,.admin button{background:#1b2540;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;cursor:pointer}.tabs button.active{background:var(--accent);border-color:var(--accent)}
    .panel{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head span{color:var(--muted);font-size:13px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #202b3e}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}tbody tr:last-child td{border:0}.rank{color:#b7a2ff;font-weight:800}.empty{text-align:center;color:var(--muted);padding:34px}
    .admin{margin-top:24px;padding:18px}.admin summary{cursor:pointer;font-weight:700}.admin form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.admin input{background:#0b1220;border:1px solid var(--line);padding:10px;border-radius:9px;color:white;min-width:140px}.status{color:var(--muted);font-size:13px;margin-top:10px}
    footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}
  </style>
</head>
<body>
<header><div class="tag">MINECRAFT SURVIVAL</div><h1>SCHOOL SMP</h1><p>Player statistics and server rankings</p></header>
<main>
  <div class="tabs" id="tabs">
    <button class="active" data-sort="kills">Kills</button><button data-sort="deaths">Deaths</button>
    <button data-sort="playtime_seconds">Playtime</button><button data-sort="money">Money</button>
  </div>
  <section class="panel"><div class="panel-head"><strong id="heading">Top players · Kills</strong><span id="updated">Loading…</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Player</th><th id="metric">Kills</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading leaderboard…</td></tr></tbody></table></div>
  </section>
  <details class="panel admin"><summary>Admin login</summary>
    <form id="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form>
    <p class="status" id="adminStatus">Private administrator access.</p>
  </details>
</main>
<footer>School SMP · Statistics may take a short time to refresh</footer>
<script>
let players=[], sortBy="kills", adminToken="";
const labels={kills:"Kills",deaths:"Deaths",playtime_seconds:"Playtime",money:"Money"};
function displayValue(p){if(sortBy==="playtime_seconds"){const h=Math.floor(Number(p.playtime_seconds)/3600);return h+"h"}if(sortBy==="money")return Number(p.money).toFixed(2);return p[sortBy]??0}
async function load(){try{const r=await fetch("/api/players");if(!r.ok)throw Error();players=await r.json();render()}catch{document.getElementById("rows").innerHTML='<tr><td colspan="3" class="empty">Leaderboard is temporarily unavailable.</td></tr>'}}
function render(){const sorted=[...players].sort((a,b)=>Number(b[sortBy])-Number(a[sortBy]));document.getElementById("heading").textContent="Top players · "+labels[sortBy];document.getElementById("metric").textContent=labels[sortBy];document.getElementById("updated").textContent=players.length+" players";document.getElementById("rows").innerHTML=sorted.length?sorted.map((p,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+escapeHtml(p.username)+'</td><td>'+displayValue(p)+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">No player data yet. Connect your Minecraft server to begin.</td></tr>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById("tabs").addEventListener("click",e=>{if(!e.target.dataset.sort)return;sortBy=e.target.dataset.sort;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b===e.target));render()});
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();document.getElementById("adminStatus").textContent=r.ok?"Admin login successful. Admin API is ready.":(d.error||"Login failed.");if(r.ok)adminToken=d.token});
load();setInterval(load,15000);
</script>
</body></html>
